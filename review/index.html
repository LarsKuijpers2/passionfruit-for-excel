<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passionfruit Review</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --background: #09090b;
      --foreground: #fafafa;
      --card: #0a0a0c;
      --card-foreground: #fafafa;
      --muted: #27272a;
      --muted-foreground: #a1a1aa;
      --border: #27272a;
      --input: #27272a;
      --primary: #fafafa;
      --primary-foreground: #18181b;
      --secondary: #27272a;
      --secondary-foreground: #fafafa;
      --accent: #27272a;
      --accent-foreground: #fafafa;
      --destructive: #7f1d1d;
      --radius: 6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--background);
      color: var(--foreground);
      height: 100vh;
      overflow: hidden;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Loading state */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--foreground);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: var(--muted-foreground);
    }

    /* Welcome screen (no questionnaire selected) */
    .welcome-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 24px;
      padding: 40px;
    }
    .welcome-title {
      font-size: 24px;
      font-weight: 600;
    }
    .welcome-subtitle {
      color: var(--muted-foreground);
      max-width: 400px;
      text-align: center;
    }
    .questionnaire-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 500px;
      width: 100%;
      max-height: 400px;
      overflow-y: auto;
    }
    .questionnaire-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      color: inherit;
    }
    .questionnaire-item:hover {
      background: var(--accent);
      border-color: var(--muted-foreground);
    }
    .questionnaire-name {
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .questionnaire-meta {
      font-size: 12px;
      color: var(--muted-foreground);
    }

    /* Header */
    .header {
      background: var(--card);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--foreground);
    }
    .header .meta {
      font-size: 12px;
      color: var(--muted-foreground);
      margin-top: 2px;
    }
    .app-title {
      font-size: 12px;
      color: var(--muted-foreground);
      margin-bottom: 2px;
    }

    /* View toggles */
    .toggles {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .toggle {
      padding: 6px 12px;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted-foreground);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .toggle:hover {
      background: var(--accent);
      color: var(--foreground);
    }
    .toggle.active {
      background: var(--foreground);
      color: var(--background);
      border-color: var(--foreground);
    }
    .toggle-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
    }

    /* Connection status */
    .connection-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .connection-status.connected { background: #22c55e; }
    .connection-status.disconnected { background: #ef4444; }
    .connection-status.checking { background: #f59e0b; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }

    /* Sidebar toggle */
    .sidebar-toggle {
      background: transparent;
      border: none;
      color: var(--muted-foreground);
      cursor: pointer;
      padding: 8px;
      margin-right: 12px;
      border-radius: var(--radius);
      transition: all 0.15s ease;
    }
    .sidebar-toggle:hover {
      background: var(--muted);
      color: var(--foreground);
    }
    .sidebar-toggle svg {
      width: 20px;
      height: 20px;
    }

    /* Main layout */
    .main {
      display: flex;
      height: calc(100vh - 56px - 40px);
      overflow: hidden;
    }

    /* Panels */
    .panel {
      flex: 1;
      display: none;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
      min-width: 0;
    }
    .panel.visible { display: flex; }
    .panel:last-child { border-right: none; }
    .panel-header {
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: var(--card);
      border-right: 1px solid var(--border);
      display: none;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar.open { display: flex; }
    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 500;
      font-size: 13px;
    }
    .sidebar-content {
      flex: 1;
      overflow-y: auto;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.15s ease;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
    }
    .sidebar-item:hover { background: var(--muted); }
    .sidebar-item.active { background: var(--accent); border-left: 2px solid var(--foreground); }
    .sidebar-item-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }
    .sidebar-item-badge {
      font-size: 11px;
      padding: 2px 6px;
      background: var(--muted);
      border-radius: 10px;
      color: var(--muted-foreground);
    }

    /* Excel table */
    .sheet-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .sheet-tab {
      padding: 6px 12px;
      background: var(--secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .sheet-tab:hover { background: var(--accent); }
    .sheet-tab.active {
      background: var(--foreground);
      color: var(--background);
    }
    .sheet-content { display: none; }
    .sheet-content.active { display: block; }

    .excel-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .excel-table th, .excel-table td {
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
      white-space: nowrap;
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .excel-table th {
      background: var(--muted);
      font-weight: 500;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .excel-table .row-header {
      background: var(--muted);
      color: var(--muted-foreground);
      font-weight: 500;
      text-align: center;
      width: 40px;
    }
    .excel-table tr:hover td:not(.row-header) {
      background: rgba(255,255,255,0.03);
    }
    .excel-table td.highlighted {
      background: rgba(59, 130, 246, 0.2) !important;
      outline: 2px solid #3b82f6;
    }
    /* Cell formatting */
    .excel-table td.cell-bold { font-weight: 600; }
    .excel-table td.cell-italic { font-style: italic; }
    .excel-table td.cell-header {
      background: rgba(59, 130, 246, 0.1);
      font-weight: 600;
    }
    .excel-table td.cell-label {
      color: var(--muted-foreground);
    }
    .excel-table td.cell-section {
      background: var(--muted);
      font-weight: 600;
      color: var(--foreground);
    }
    .excel-table tr.row-header-type td:not(.row-header) {
      background: rgba(59, 130, 246, 0.08);
    }
    .excel-table tr.row-section-type td:not(.row-header) {
      background: var(--muted);
    }
    .excel-table td.cell-merged-hidden { display: none; }

    /* Level badges */
    .level-badge {
      display: inline-block;
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      opacity: 0.8;
      vertical-align: middle;
    }
    .level-badge.entity {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }
    .level-badge.product {
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
    }
    .level-badge.library {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    /* Cell selection for label/value pairing */
    .excel-table td.label-selected {
      background: rgba(251, 191, 36, 0.3) !important;
      outline: 2px solid #fbbf24;
    }
    .excel-table td.value-selected {
      background: rgba(34, 197, 94, 0.3) !important;
      outline: 2px solid #22c55e;
    }

    /* Multi-cell selection & annotation */
    body.select-mode .excel-table td[data-cell] { cursor: crosshair; user-select: none; }
    body.select-mode .excel-table td[data-cell]:hover { background: rgba(139, 92, 246, 0.2) !important; }
    body.select-mode.is-dragging .excel-table td[data-cell] { cursor: cell; }
    body.select-mode.is-dragging .excel-table td[data-cell]:hover { background: rgba(139, 92, 246, 0.35) !important; }
    .excel-table td.multi-selected { background: rgba(139, 92, 246, 0.3) !important; outline: 2px solid #8b5cf6; }
    .toggle.select-active { background: #8b5cf6 !important; color: white !important; border-color: #8b5cf6 !important; }
    .annotation-panel { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; z-index: 1000; width: 500px; max-width: 90vw; box-shadow: 0 8px 32px rgba(0,0,0,0.4); display: none; }
    .annotation-panel.visible { display: block; }
    .annotation-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .annotation-panel-title { font-weight: 600; font-size: 14px; }
    .annotation-panel-close { background: none; border: none; color: var(--muted-foreground); cursor: pointer; font-size: 18px; padding: 4px 8px; }
    .annotation-cells { background: var(--muted); padding: 8px 12px; border-radius: var(--radius); margin-bottom: 12px; font-size: 12px; max-height: 100px; overflow-y: auto; }
    .annotation-cell { display: flex; gap: 8px; padding: 2px 0; }
    .annotation-cell-id { color: #8b5cf6; font-family: ui-monospace, monospace; min-width: 40px; }
    .annotation-cell-value { color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .annotation-input { width: 100%; padding: 10px 12px; background: var(--background); border: 1px solid var(--border); border-radius: var(--radius); color: var(--foreground); font-size: 13px; resize: none; margin-bottom: 12px; }
    .annotation-input:focus { outline: none; border-color: #8b5cf6; }
    .annotation-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .annotation-btn { padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; }
    .annotation-btn-secondary { background: var(--muted); border: 1px solid var(--border); color: var(--foreground); }
    .annotation-btn-primary { background: #8b5cf6; border: 1px solid #8b5cf6; color: white; }
    .annotation-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .annotation-btn-success { background: #22c55e; border: 1px solid #22c55e; color: white; }
    .suggestion-box { background: var(--muted); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; display: none; }
    .suggestion-box.visible { display: block; }
    .suggestion-action { font-weight: 600; color: #8b5cf6; text-transform: uppercase; font-size: 11px; }
    .suggestion-description { font-size: 13px; margin-bottom: 8px; }
    .suggestion-item { background: var(--background); padding: 8px; border-radius: 4px; margin-bottom: 4px; }
    .suggestion-item-label { font-weight: 500; }
    .suggestion-item-value { color: var(--muted-foreground); margin-top: 2px; }
    .suggestion-item-section { font-size: 10px; color: #8b5cf6; margin-top: 4px; }
    .suggestion-reasoning { font-size: 11px; color: var(--muted-foreground); font-style: italic; margin-top: 8px; }
    .suggestion-actions { display: flex; gap: 8px; margin-top: 12px; }
    .annotation-loading { display: none; align-items: center; gap: 8px; color: var(--muted-foreground); font-size: 13px; margin-bottom: 12px; }
    .annotation-loading.visible { display: flex; }
    .annotation-loading .loading-spinner { width: 16px; height: 16px; border-width: 2px; }

    /* Items */
    .section {
      margin-bottom: 24px;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--muted);
      border-radius: var(--radius);
      margin-bottom: 8px;
      cursor: pointer;
    }
    .section-title {
      font-weight: 600;
      font-size: 13px;
    }
    .section-meta {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .section-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--background);
    }
    .section-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-left: 12px;
    }
    .section.collapsed .section-items { display: none; }

    .item {
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .item:hover { border-color: var(--muted-foreground); }
    .item.selected {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px #3b82f6;
    }
    .item.reviewed.correct, .item.reviewed.accepted {
      border-left: 3px solid #22c55e;
      background: rgba(34, 197, 94, 0.05);
    }
    .item.reviewed.wrong, .item.reviewed.rejected {
      border-left: 3px solid #ef4444;
      background: rgba(239, 68, 68, 0.05);
    }

    .item-label {
      font-size: 12px;
      color: var(--muted-foreground);
      margin-bottom: 4px;
    }
    .item-value {
      font-size: 13px;
      color: var(--foreground);
      background: var(--muted);
      padding: 8px 12px;
      border-radius: var(--radius);
    }
    .item-value.empty {
      color: var(--muted-foreground);
      font-style: italic;
    }
    .item-ref {
      font-size: 10px;
      color: var(--muted-foreground);
      margin-top: 8px;
      font-family: ui-monospace, monospace;
    }

    /* Review actions */
    .item-actions {
      display: flex;
      gap: 4px;
      margin-top: 8px;
    }
    .review-only { display: none; }
    body.review-mode .review-only { display: flex; }

    .action-btn {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: var(--background);
      color: var(--muted-foreground);
    }
    .action-btn:hover {
      background: var(--muted);
      color: var(--foreground);
    }
    .action-btn.correct:hover { background: #14532d; color: #4ade80; border-color: #166534; }
    .action-btn.wrong:hover { background: #7f1d1d; color: #fca5a5; border-color: #991b1b; }

    /* Keep action buttons visible on reviewed items */
    .item.reviewed .item-actions { opacity: 0.6; }
    .item.reviewed:hover .item-actions { opacity: 1; }
    .item.reviewed.correct .action-btn.correct,
    .item.reviewed.accepted .action-btn.correct { background: #14532d; color: #4ade80; border-color: #166534; }
    .item.reviewed.wrong .action-btn.wrong,
    .item.reviewed.rejected .action-btn.wrong { background: #7f1d1d; color: #fca5a5; border-color: #991b1b; }

    /* Wrong note input */
    .wrong-note-container {
      display: none;
      margin-top: 8px;
    }
    .item.show-note .wrong-note-container { display: block; }
    .wrong-note-input {
      width: 100%;
      padding: 6px 10px;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--foreground);
      font-size: 12px;
    }
    .wrong-note-btns {
      display: flex;
      gap: 4px;
      margin-top: 4px;
    }
    .wrong-note-btn {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 11px;
      cursor: pointer;
      background: var(--background);
      color: var(--muted-foreground);
    }
    .wrong-note-btn.save { background: #7f1d1d; color: #fca5a5; border-color: #991b1b; }

    /* Group buttons */
    .group-btns {
      display: flex;
      gap: 4px;
    }
    .group-btn {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 11px;
      cursor: pointer;
      background: var(--background);
      color: var(--muted-foreground);
      transition: all 0.15s ease;
    }
    .group-btn:hover {
      background: var(--muted);
      color: var(--foreground);
    }
    .group-btn.accept-all:hover { background: #14532d; color: #4ade80; }
    .group-btn.reject-all:hover { background: #7f1d1d; color: #fca5a5; }

    /* Stats bar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      background: var(--card);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted-foreground);
    }
    .stats-bar .stat {
      display: flex;
      gap: 16px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--foreground);
      color: var(--background);
      padding: 10px 20px;
      border-radius: var(--radius);
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Empty state */
    .empty {
      color: var(--muted-foreground);
      text-align: center;
      padding: 40px;
      font-style: italic;
    }

    /* App container */
    .app-container {
      display: none;
      flex-direction: column;
      height: 100vh;
    }
    .app-container.visible {
      display: flex;
    }
  </style>
</head>
<body>
  <!-- Loading state -->
  <div class="loading-container" id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Loading...</div>
  </div>

  <!-- Welcome screen (no questionnaire selected) -->
  <div class="welcome-container" id="welcome" style="display: none;">
    <h1 class="welcome-title">Passionfruit Review</h1>
    <p class="welcome-subtitle">Select a questionnaire to review its indexed structure and harvested library items.</p>
    <div class="questionnaire-list" id="questionnaire-list"></div>
  </div>

  <!-- Main app -->
  <div class="app-container" id="app">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">Questionnaires</div>
      <div class="sidebar-content" id="sidebar-list"></div>
    </div>

    <!-- Header -->
    <div class="header">
      <div style="display: flex; align-items: center;">
        <button class="sidebar-toggle" id="sidebar-toggle" title="Open questionnaire list (B)">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div>
          <div class="app-title">Passionfruit Review</div>
          <h1 id="questionnaire-title">Loading...</h1>
          <div class="meta" id="questionnaire-meta"></div>
        </div>
      </div>
      <div class="toggles">
        <span id="connection-status" class="connection-status checking"></span>
        <button class="toggle active" data-panel="original" title="Toggle Original (1)">Original</button>
        <button class="toggle active" data-panel="indexed" title="Toggle Indexed (2)">Indexed</button>
        <button class="toggle" data-panel="library" title="Toggle Library (3)">Library</button>
        <div class="toggle-divider"></div>
        <button class="toggle" id="select-toggle" title="Multi-select cells to annotate (S)">Select</button>
        <button class="toggle" id="review-toggle" title="Toggle review mode (R)">Review</button>
        <button class="toggle" id="complete-toggle" title="Complete Review">Complete Review (<span id="feedback-count">0</span>)</button>
        <button class="toggle" id="clear-toggle" title="Clear all feedback">Clear</button>
        <button class="toggle" title="Help (?)">?</button>
      </div>
