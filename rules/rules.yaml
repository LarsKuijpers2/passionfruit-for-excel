# =============================================================================
# ROUTING RULES
# =============================================================================

routing:
  # Entity-level topics: Answer Library first (except for data fields)
  entity_level:
    company_information: entity_db
    contact_persons: entity_db
    certifications: entity_db  # certificate data is structured
    quality_systems: answer_library
    complaints: answer_library
    traceability: answer_library
    shelf_life: answer_library  # approach; product values go elsewhere
    food_fraud: answer_library
    food_defense: answer_library
    foreign_bodies: answer_library
    raw_materials: answer_library
    sustainability: evidence_ref
    ethical_social: answer_library
    declaration: evidence_ref
    country_regulatory: evidence_ref
    measuring_instruments: answer_library

  # Product-level topics: NEVER Answer Library
  product_level:
    identification: product_spec
    physical_properties: product_spec
    sensory: product_spec
    analytical: product_spec
    formula_composition: product_spec
    allergens: product_spec
    nutritional: product_spec
    regulatory_ids: product_spec
    microbiological: product_spec
    contaminants: product_spec
    gmo: product_spec
    claims: product_spec
    rspo_palm: product_spec
    packaging: product_spec
    storage_transport: product_spec
    coding: product_spec
    origin_provenance: product_spec

# =============================================================================
# FLAG CONDITIONS
# =============================================================================

flag_for_review:
  - condition: no_topic_match
    message: "Could not determine topic — review needed"

  - condition: low_confidence
    threshold: 0.5
    message: "Low confidence classification"

  - condition: contains_commitment
    patterns:
      - "(?i)we (can |will )?(guarantee|promise|ensure|commit)"
      - "(?i)we (are able|commit) to"
      - "(?i)upon request"
      - "(?i)can be provided"
    message: "Contains commitment — verify before adding to Answer Library"

  - condition: new_answer_pattern
    message: "New answer not in Answer Library — review for potential reuse"

  - condition: conflicting_information
    message: "Answer conflicts with existing data"

  - condition: product_not_identified
    message: "Could not identify which product this applies to"

  - condition: legal_implication
    patterns:
      - "(?i)liability"
      - "(?i)warranty"
      - "(?i)contractual"
      - "(?i)legally binding"
    message: "Potential legal implication — requires review"

# =============================================================================
# ANSWER FORMATS
# =============================================================================

answer_formats:
  yes_no:
    patterns:
      - "(?i)^(yes|no|ja|nein|oui|non)$"
      - "(?i)^(yes|no)\\s*[-—]"
    format: "{answer}"

  yes_no_with_explanation:
    patterns:
      - "(?i)^(yes|no)[,.]?\\s+.+"
    format: "{answer} — {explanation}"

  numeric_value:
    patterns:
      - "\\d+([.,]\\d+)?\\s*(mg|g|kg|%|°C|°F|months?|years?|days?|hours?)"
    format: "{value} {unit}"

  range:
    patterns:
      - "\\d+([.,]\\d+)?\\s*[-–—]\\s*\\d+([.,]\\d+)?\\s*(mg|g|kg|%|°C)"
    format: "{min} - {max} {unit}"

  certificate_reference:
    format: "See attached {cert_type} certificate (No. {cert_number}, valid until {expiry})"

  not_applicable:
    patterns:
      - "(?i)^n/?a$"
      - "(?i)^not applicable$"
      - "(?i)^nicht zutreffend$"
    format: "N/A"

  not_found:
    format: "[NOT FOUND — requires review]"

# =============================================================================
# CUSTOMER-SPECIFIC (Log Only)
# =============================================================================

log_only_patterns:
  - "(?i)specific.*request"
  - "(?i)customer.*requirement"
  - "(?i)as.*requested.*by"
  - "(?i)for.*this.*order"
  - "(?i)delivery.*date"
  - "(?i)pricing|price"
  - "(?i)minimum.*order"
  - "(?i)lead.*time"

# =============================================================================
# PLACEHOLDER FILTERS
# =============================================================================
# These patterns are excluded from extraction — they're template labels,
# not actual question-answer pairs.

exclude_patterns:
  # French placeholders
  - "(?i)^réponse\\s*/\\s*answer\\s*:?$"
  - "(?i)^laquelle\\s*/\\s*which one\\s*:?$"
  - "(?i)^lequel\\s*/\\s*which one\\s*:?$"
  - "(?i)^précisions\\s*/\\s*details\\s*:?$"
  - "(?i)^commentaires?\\s*/\\s*comments?\\s*:?$"

  # Generic placeholders
  - "(?i)^reference\\s*/\\s*reference$"
  - "(?i)^answer\\s*:?$"
  - "(?i)^response\\s*:?$"
  - "(?i)^antwort\\s*:?$"
  - "(?i)^details?\\s*:?$"
  - "(?i)^comments?\\s*:?$"
  - "(?i)^remarks?\\s*:?$"
  - "(?i)^notes?\\s*:?$"
  - "(?i)^bemerkungen?\\s*:?$"

  # Empty instruction labels
  - "(?i)^please (specify|indicate|provide|describe)\\s*:?$"
  - "(?i)^bitte (angeben|beschreiben)\\s*:?$"
  - "(?i)^if yes,?\\s*(please)?\\s*:?$"
  - "(?i)^if no,?\\s*(please)?\\s*:?$"
  - "(?i)^falls ja\\s*:?$"
  - "(?i)^falls nein\\s*:?$"

  # Column headers mistaken as Q&A
  - "(?i)^yes\\s*/\\s*no$"
  - "(?i)^ja\\s*/\\s*nein$"
  - "(?i)^oui\\s*/\\s*non$"
  - "(?i)^n/?a$"

  # Page headers/footers
  - "(?i)^ref\\s+[a-z0-9.-]+\\s+version"
  - "(?i)^page\\s+\\d+\\s*/\\s*\\d+$"

  # French/English label placeholders
  - "(?i)^autre\\s*/\\s*other\\s*:?$"
  - "(?i)^autres\\s*:?\\s*\\(pr[eé]cisez\\)$"
  - "(?i)^absence$"
  - "(?i)^st[eé]rilis[eé]\\s+UHT\\s*/\\s*sterilized$"
  - "(?i)^lequel\\s*/\\s*which one\\s*:?$"
  - "(?i)^pr[eé]cisez\\s*/\\s*(please\\s+)?specify\\s*:?$"

  # Example/hint text
  - "(?i)^z\\.\\s*B\\..*e\\.\\s*g\\."
  - "(?i)^e\\.\\s*g\\.\\s+\\d+"
  - "(?i)^z\\.\\s*B\\.\\s+\\d+"

  # Decision tree nodes (from rules model)
  - "^[└├│─►]"
