  - id: sustainability
    name: Sustainability
    description: EcoVadis, SBTI, carbon footprint, environmental, water/energy
    level: [group, company]
    destination: evidence_ref
    evidence_type: statement
    reusable: false
    keywords:
      - sustainability
      - ecovadis
      - sbti
      - science based targets
      - carbon footprint
      - co2
      - greenhouse gas
      - ghg
      - scope 1
      - scope 2
      - scope 3
      - environmental
      - water usage
      - energy consumption
      - renewable energy
      - waste management
      - recycling
