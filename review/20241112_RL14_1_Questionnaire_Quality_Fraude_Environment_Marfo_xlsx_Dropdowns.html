    * { box-sizing: border-box; }

      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

    h1 {

    }
    table {
      border-collapse: collapse;
      font-size: 11px;
      min-width: 100%;
    }
    th, td {
      border: 1px solid #e0e0e0;
      padding: 4px 6px;

      text-overflow: ellipsis;

    }

      color: #666;
      font-size: 10px;
      text-align: center;
      width: 30px;
      position: sticky;
      left: 0;
      z-index: 5;
    }
    .empty { background: #fafafa; }

    /* Cell roles */
    .role-header { background: #e3f2fd !important; font-weight: bold; }
    .role-section { background: #bbdefb !important; font-weight: bold; font-size: 12px; }
    .role-label { background: #f5f5f5 !important; }
    .role-input { background: #fff9c4 !important; }
    .role-value { background: #fff !important; }

    /* Formatting */
    .bold { font-weight: bold; }
    .merged { border: 2px solid #1976d2; }

    /* Hover */
    td:hover:not(.row-num):not(.empty) {
      outline: 2px solid #1976d2;
      cursor: pointer;
    }

    /* Section overlay */
    .section-marker {
      position: absolute;
      border: 3px solid;
      pointer-events: none;
      opacity: 0.5;
    }

    /* Legend */
    .legend {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }
    .legend-box {
      width: 16px;
      height: 16px;
      border: 1px solid #ccc;
    }

    /* Navigation */
    .nav {
      margin-bottom: 20px;
    }
    .nav a {
      color: #1976d2;
      text-decoration: none;
      margin-right: 15px;
    }
    .nav a:hover {
      text-decoration: underline;
    }

</head>
