      - vaccp
      - intentional contamination
      - access control
      - visitor policy
      - visitor register
      - transport security
      - tamper evident
      - seal
    patterns:
      - "(?i)food.*defense"
      - "(?i)vaccp"
      - "(?i)access.*control"
      - "(?i)visitor.*(policy|register)"
      - "(?i)intentional.*contamination"

  - id: foreign_bodies
    name: Foreign Bodies
    description: Metal detection, X-ray, glass policy, sieve/filter controls
    level: [company, site]
    destination: answer_library
    evidence_type: procedure
    reusable: true
    keywords:
