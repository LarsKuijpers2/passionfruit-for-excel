# Topic Definitions for Questionnaire Indexing
#
# Topics are organized by category:
# - ENTITY: Company/organization information
# - PRODUCT: Product-specific data
# - OPERATIONS: Day-to-day operational processes
# - COMPLIANCE: Certifications, audits, food safety
# - SUSTAINABILITY: Environmental and ethical
# - ADMIN: Administrative and documentation

version: "2.0"

topics:
  # ===========================================================================
  # ENTITY - Company/Organization Information
  # ===========================================================================

  - id: entity_info
    name: Entity Information
    description: Company name, address, legal info, registration numbers
    patterns:
      - "company|firmierung|entreprise|bedrijf|unternehmen"
      - "general.*data|allgemeine.*daten|algemene"
      - "supplier.*info|leverancier|lieferant|fournisseur"
      - "manufacturer.*info|fabrikant|fabricant"
    keywords:
      - company
      - supplier
      - manufacturer
      - business
      - legal
      - registration

  - id: entity_contacts
    name: Entity Contacts
    description: Contact persons, phone, email
    patterns:
      - "contact|ansprech|kontakt|contactpersoon"
    keywords:
      - contact
      - person
      - responsible
      - phone
      - email

  - id: entity_certifications
    name: Entity Certifications
    description: Company-level certifications and standards
    patterns:
      - "company.*certif|bedrijfs.*certif"
    keywords:
      - company certification
      - accreditation

  # ===========================================================================
  # PRODUCT - Product-Specific Data
  # ===========================================================================

  - id: product_identification
    name: Product Identification
    description: Product name, code, reference, article number
    patterns:
      - "product.*name|produkt.*name|produit.*nom"
      - "article.*number|artikelnummer|numéro.*article"
      - "product.*code|produkt.*code"
      - "product.*reference|referentie"
    keywords:
      - product name
      - article number
      - SKU
      - reference
      - item code

  - id: product_attributes
    name: Product Attributes
    description: Physical attributes - appearance, taste, smell, color, texture
    patterns:
      - "appearance|aussehen|aspect|uiterlijk"
      - "taste|geschmack|goût|smaak"
      - "smell|odour|odor|geruch|geur"
      - "colour|color|farbe|couleur|kleur"
      - "texture|textur"
    keywords:
      - appearance
      - taste
      - smell
      - odour
      - color
      - colour
      - texture

  - id: product_composition
    name: Product Composition
    description: Ingredients list, recipe, formula
    patterns:
      - "ingredient|zutat|ingrédient|ingrediënt"
      - "composition|zusammensetzung|samenstelling"
      - "formula|formul|recept|recipe"
    keywords:
      - ingredient
      - composition
      - formula
      - recipe

  - id: product_allergens
    name: Product Allergens
    description: Allergen declarations, cross-contamination
    patterns:
      - "allerg"
      - "cross.*contamin|kruisbesmetting"
    keywords:
      - allergen
      - gluten
      - nuts
      - dairy
      - eggs
      - soy
      - cross-contamination

  - id: product_nutrition
    name: Product Nutrition
    description: Nutritional values, calories, macros
    patterns:
      - "nutri|nährwert|valeur.*nutritive|voedingswaarde"
      - "calori|energie|energy"
    keywords:
      - nutrition
      - calories
      - protein
      - carbohydrate
      - fat
      - sugar
      - salt

  - id: product_certifications
    name: Product Certifications
    description: Product-level certifications - halal, kosher, organic, vegan
    patterns:
      - "halal|kosher|kasher"
      - "organic|bio|biologisch|écologique"
      - "vegan|vegetarian|végétar"
    keywords:
      - halal
      - kosher
      - organic
      - vegan
      - vegetarian

  - id: product_specifications
    name: Product Specifications
    description: Shelf life, storage conditions, technical specs
    patterns:
      - "shelf.*life|haltbarkeit|durée.*conservation|houdbaarheid"
      - "storage.*condition|lager|stockage|opslag"
      - "specification|spezifikation|spécification|specificatie"
    keywords:
      - shelf life
      - storage
      - expiry
      - best before
      - specification

  - id: product_packaging
    name: Product Packaging
    description: Packaging materials, dimensions, labeling
    patterns:
      - "packag|verpack|emballage|verpakking"
      - "label|etiket|étiquette"
    keywords:
      - packaging
      - label
      - container
      - box
      - carton

  # ===========================================================================
  # OPERATIONS - Day-to-day Operational Processes
  # ===========================================================================

  - id: quality_systems
    name: Quality Systems
    description: QMS, HACCP, food safety management systems
    patterns:
      - "haccp|food.*safety.*system|lebensmittel.*sicherheit"
      - "quality.*management|qualitäts.*management|qm.*system"
      - "quality.*system|kwaliteits.*systeem"
    keywords:
      - quality
      - QMS
      - HACCP
      - food safety system

  - id: premises
    name: Premises & Facilities
    description: Building, facilities, zoning, utilities, infrastructure
    patterns:
      - "building|gebäude|bâtiment|gebouw"
      - "facilit|einrichtung|installation"
      - "zon(e|ing)|bereich"
      - "infrastruc"
      - "premises|bedrijfspand"
    keywords:
      - building
      - facilities
      - zoning
      - utilities
      - infrastructure
      - premises
      - site

  - id: equipment
    name: Equipment & Maintenance
    description: Production equipment, maintenance, calibration
    patterns:
      - "equipment|ausrüstung|équipement|apparatuur"
      - "maintenan|wartung|entretien|onderhoud"
      - "calibrat|kalibrier|étalonnage|kalibratie"
    keywords:
      - equipment
      - maintenance
      - calibration
      - machinery

  - id: hygiene
    name: Hygiene
    description: Personal hygiene, handwashing, protective clothing
    patterns:
      - "personal.*hygien|persoonlijke.*hygiëne"
      - "handwash|händewaschen|handen.*wassen"
      - "protective.*cloth|schutzkleidung|beschermende.*kleding"
    keywords:
      - hygiene
      - handwashing
      - personal hygiene
      - protective clothing
      - work clothes

  - id: cleaning
    name: Cleaning & Sanitation
    description: Cleaning procedures, sanitation, disinfection
    patterns:
      - "clean|reinig|nettoyage|schoonma"
      - "sanit|desinfect|désinfect"
    keywords:
      - cleaning
      - sanitation
      - disinfection
      - sanitization

  - id: pest_control
    name: Pest Control
    description: Pest management, pest prevention
    patterns:
      - "pest|schädling|nuisible|ongedierte"
      - "rodent|insect"
    keywords:
      - pest
      - pest control
      - rodent
      - insect
      - vermin

  - id: monitoring
    name: Monitoring & Testing
    description: Environmental monitoring, air/water testing, sampling
    patterns:
      - "monitor|überwach|surveillance"
      - "air.*quality|luftqualität"
      - "water.*quality|wasserqualität"
      - "sampl|proben|échantillon|monster"
      - "testing|prüfung|test"
    keywords:
      - monitoring
      - air quality
      - water quality
      - sampling
      - testing

  - id: raw_materials
    name: Raw Materials
    description: Raw material sourcing, suppliers, incoming goods
    patterns:
      - "raw.*material|rohstoff|matière.*première|grondstof"
      - "incoming.*good|wareneingang"
      - "supplier.*approv|leveranciers.*goedkeuring"
    keywords:
      - raw material
      - supplier
      - sourcing
      - incoming

  - id: traceability
    name: Traceability
    description: Traceability systems, batch tracking, lot numbers
    patterns:
      - "traceab|rückverfolgb|traça|traceerbaarheid"
      - "batch|charge|lot|partij"
    keywords:
      - traceability
      - batch
      - lot
      - tracking

  - id: logistics
    name: Logistics & Storage
    description: Transport, storage, shipping, delivery
    patterns:
      - "logist|transport|shipping|lieferung|livraison"
      - "storage|lager|stockage|opslag"
      - "delivery|lieferung|livraison|levering"
    keywords:
      - logistics
      - transport
      - storage
      - shipping
      - delivery

  - id: waste
    name: Waste Management
    description: Waste handling, disposal, waste water
    patterns:
      - "waste|abfall|déchet|afval"
      - "disposal|entsorgung|verwijdering"
    keywords:
      - waste
      - disposal
      - garbage

  - id: microbiology
    name: Microbiology
    description: Microbiological testing, bacteria, pathogens
    patterns:
      - "bacterio|micro|keime|microbiolog"
      - "pathogen|ziekteverwekker"
    keywords:
      - microbiological
      - bacteria
      - pathogen

  # ===========================================================================
  # COMPLIANCE - Certifications, Audits, Food Safety
  # ===========================================================================

  - id: certifications
    name: Certifications & Standards
    description: Quality certifications - BRC, IFS, FSSC, ISO
    patterns:
      - "certif|zertif"
      - "standard|norm"
      - "accredit"
    keywords:
      - certification
      - certificate
      - accreditation
      - standard
      - IFS
      - BRC
      - FSSC
      - ISO

  - id: audits
    name: Audits & Inspections
    description: Internal/external audits, inspections
    patterns:
      - "audit|prüfung"
      - "inspection|inspektion|inspectie"
    keywords:
      - audit
      - inspection
      - assessment

  - id: food_safety
    name: Food Safety
    description: Food safety procedures, hazard analysis
    patterns:
      - "food.*safety|lebensmittel.*sicherheit|voedselveiligheid"
      - "hazard.*analysis|gefahrenanalyse"
      - "ccp|critical.*control"
    keywords:
      - food safety
      - hazard
      - CCP
      - critical control point

  - id: food_defense
    name: Food Defense
    description: Food defense, security, tampering prevention
    patterns:
      - "food.*defense|food.*defence"
      - "security|sicherheit|beveiliging"
      - "tamper|manipulat"
    keywords:
      - defense
      - security
      - tampering

  - id: food_fraud
    name: Food Fraud
    description: Food fraud prevention, authenticity
    patterns:
      - "fraud|betrug|fraude"
      - "authenticity|authentizität|authenticiteit"
      - "adulter"
    keywords:
      - fraud
      - authenticity
      - adulteration

  - id: crisis
    name: Crisis Management
    description: Recall procedures, crisis management, complaints
    patterns:
      - "crisis|krisen|crise"
      - "recall|rückruf|rappel|terugroep"
      - "complaint|reklamation|réclamation|klacht"
      - "withdrawal|rücknahme"
    keywords:
      - crisis
      - recall
      - complaint
      - withdrawal

  - id: origin
    name: Origin & Provenance
    description: Product origin, country of origin
    patterns:
      - "origin|herkunft|origine|oorsprong"
      - "provenance|herkomst"
      - "country.*of.*origin"
    keywords:
      - origin
      - provenance
      - country

  # ===========================================================================
  # SUSTAINABILITY - Environmental and Ethical
  # ===========================================================================

  - id: sustainability
    name: Sustainability & CSR
    description: Sustainability, CSR, carbon footprint
    patterns:
      - "sustain|nachhaltig|durable|duurzaam"
      - "csr|corporate.*social"
      - "carbon|co2|klimaat|climate"
    keywords:
      - sustainability
      - CSR
      - carbon
      - CO2

  - id: environment
    name: Environment
    description: Environmental policies, environmental management
    patterns:
      - "environment|umwelt|environnement|milieu"
      - "iso.*14001"
    keywords:
      - environment
      - environmental
      - ISO 14001

  - id: animal_welfare
    name: Animal Welfare
    description: Animal welfare policies
    patterns:
      - "animal.*welfare|tier.*wohl|dierenwelzijn"
      - "ethical.*animal"
    keywords:
      - animal welfare
      - ethical

  # ===========================================================================
  # ADMIN - Administrative and Documentation
  # ===========================================================================

  - id: training
    name: Training
    description: Staff training, competency, awareness
    patterns:
      - "training|schulung|formation|opleiding"
      - "competenc|kompetenz|bekwaamheid"
    keywords:
      - training
      - competency
      - awareness
      - education

  - id: documents
    name: Documents
    description: Document references, attachments
    patterns:
      - "document|dokument|pièce"
      - "attachment|anlage|bijlage"
    keywords:
      - document
      - attachment

  - id: signature
    name: Signature
    description: Signatures, sign-off, authorization
    patterns:
      - "signature|unterschrift|ondertekening"
      - "sign.*off|unterzeichn"
    keywords:
      - signature
      - sign

  - id: approval
    name: Approval
    description: Approvals, authorizations
    patterns:
      - "approv|genehmig|goedkeuring"
      - "authoriz|autoris"
    keywords:
      - approval
      - authorization

  - id: financial
    name: Financial
    description: Financial information, banking
    patterns:
      - "financ|finanz"
      - "bank|steuer|tax|btw|vat"
    keywords:
      - financial
      - bank
      - tax

  # ===========================================================================
  # DEFAULT
  # ===========================================================================

  - id: other
    name: Other
    description: Uncategorized items
    patterns: []
    keywords: []
