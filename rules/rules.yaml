      - foreign matter
      - metal detection
      - metal detector
      - x-ray
      - glass policy
      - glass and brittle
      - sieve
      - filter
      - magnet
      - screen
      - mesh size
    patterns:
      - "(?i)foreign.*(body|matter|object)"
      - "(?i)metal.*detect"
      - "(?i)x-ray"
      - "(?i)glass.*policy"
      - "(?i)sieve|filter|magnet"

  - id: raw_materials
    name: Raw Materials
    description: Supplier approval, incoming inspection, approved list
    level: [company]
    destination: answer_library
    evidence_type: procedure
    reusable: true
    keywords:
      - raw material
      - supplier approval
      - supplier evaluation
      - incoming inspection
      - goods receipt
      - approved supplier
      - supplier list
      - supplier audit
      - coa check
    patterns:
      - "(?i)raw.*material"
      - "(?i)supplier.*(approval|evaluation|audit)"
