# Questionnaire Processing Rules v1.0
# Based on Agent Setup & Rules Model

version: "1.0"

# =============================================================================
# TOPICS (33 total)
# =============================================================================
# Each topic defines:
# - id: unique identifier
# - name: display name
# - description: what this topic covers
# - level: which entity level(s) this applies to
# - destination: where the data should go
# - evidence_type: what type of evidence supports this
# - keywords: terms that indicate this topic
# - patterns: regex patterns for matching
# - reusable: whether answers can go to Answer Library
# =============================================================================

topics:
  # ---------------------------------------------------------------------------
  # ENTITY-LEVEL TOPICS (Company/Group/Site)
  # ---------------------------------------------------------------------------

  - id: company_information
    name: Company Information
    description: Legal details, registration, contact, ownership, structure
    level: [company, group]
    destination: entity_db
    evidence_type: null
    reusable: false
    keywords:
      - company name
      - legal name
      - trade name
      - address
      - street
      - city
      - postal code
      - zip
      - country
      - phone
      - telephone
      - fax
      - email
      - website
      - url
      - vat
      - tax number
      - coc
      - chamber of commerce
      - registration number
      - duns
      - founding year
      - ownership
      - parent company
      - group
      - legal form
      - gps
      - coordinates
    patterns:
      - "(?i)company.*name"
      - "(?i)legal.*name"
      - "(?i)trade.*name"
      - "(?i)vat.*(id|number|nr)"
      - "(?i)tax.*(id|number)"
      - "(?i)(postal|zip).*code"
      - "(?i)registered.*address"

  - id: contact_persons
    name: Contact Persons
    description: Contact details for key personnel
    level: [company]
    destination: entity_db
    evidence_type: null
    reusable: false
    keywords:
      - contact person
      - contact details
      - responsible person
      - quality manager
      - managing director
      - crisis contact
      - emergency contact
      - function
      - department
      - name
      - surname
    patterns:
      - "(?i)contact.*person"
      - "(?i)responsible.*for"
      - "(?i)quality.*manager"
      - "(?i)who.*is.*responsible"

  - id: certifications
    name: Certifications
    description: GFSI, ISO, Organic, Halal, Kosher — certificate data
    level: [company]
    destination: entity_db
    evidence_type: certificate
    reusable: false
    keywords:
      - fssc
      - fssc 22000
      - brc
      - ifs
      - sqf
      - iso 9001
      - iso 14001
      - iso 22000
      - haccp
      - halal
      - kosher
      - organic
      - bio
      - demeter
      - certificate
      - certified
      - certification
      - accreditation
      - audit
      - certification body
      - valid until
      - expiry
      - scope
    patterns:
      - "(?i)certif(ied|icate|ication)"
      - "(?i)(fssc|brc|ifs|sqf|iso).*\\d"
      - "(?i)halal|kosher|organic"
      - "(?i)valid.*until"
      - "(?i)expir(y|es)"
    extract_fields:
      - cert_type
      - cert_number
      - valid_until
      - scope
      - certification_body

  - id: quality_systems
    name: Quality Systems
    description: HACCP, food safety management, audits, validation
    level: [company]
    destination: answer_library
    evidence_type: procedure
    reusable: true
    keywords:
      - haccp
      - haccp plan
      - food safety
      - quality management
      - quality policy
      - quality system
      - ccp
      - critical control point
      - prerequisite program
      - prp
      - oprp
      - validation
      - verification
      - internal audit
      - management review
      - document control
      - record keeping
    patterns:
      - "(?i)haccp"
      - "(?i)food.*safety.*management"
      - "(?i)quality.*(system|management|policy)"
      - "(?i)critical.*control"
      - "(?i)internal.*audit"

  - id: complaints
    name: Complaints
    description: Complaint handling, recall, CAPA, statistics
    level: [company]
    destination: answer_library
    evidence_type: procedure
    reusable: true
    keywords:
      - complaint
      - customer complaint
      - recall
      - withdrawal
      - capa
      - corrective action
      - preventive action
      - root cause
      - statistics
      - trend analysis
    patterns:
      - "(?i)complaint.*handling"
      - "(?i)recall.*procedure"
      - "(?i)corrective.*action"
      - "(?i)capa"

  - id: traceability
    name: Traceability
    description: Batch tracking, recall exercises, 4-hour capability
    level: [company]
    destination: answer_library
    evidence_type: procedure
    reusable: true
    keywords:
      - traceability
      - batch tracking
      - lot tracking
      - recall exercise
      - mock recall
      - one step back
      - one step forward
      - 4 hour
      - four hour
      - record retention
    patterns:
      - "(?i)traceab(ility|le)"
      - "(?i)batch.*track"
      - "(?i)recall.*exercise"
      - "(?i)mock.*recall"
      - "(?i)one.*step.*(back|forward)"

  - id: shelf_life
    name: Shelf Life
    description: Shelf life determination, validation, accelerated studies
    level: [company, product_group, product]
    destination: answer_library  # company-level approach; product values go to product_spec
    evidence_type: procedure
    reusable: true
    keywords:
      - shelf life
      - best before
      - expiry
      - durability
      - accelerated study
      - stability study
      - shelf life determination
      - mhd
      - mindesthaltbarkeit
    patterns:
      - "(?i)shelf.*life"
      - "(?i)best.*before"
      - "(?i)stability.*study"
      - "(?i)accelerated.*test"

  - id: food_fraud
    name: Food Fraud
    description: Vulnerability assessment, TACCP, mitigation
    level: [company]
    destination: answer_library
    evidence_type: procedure
    reusable: true
    keywords:
      - food fraud
      - vulnerability assessment
      - taccp
      - authenticity
      - economically motivated adulteration
      - ema
      - mitigation
      - supply chain verification
    patterns:
      - "(?i)food.*fraud"
      - "(?i)taccp"
      - "(?i)vulnerability.*assessment"
      - "(?i)authenticity"

  - id: food_defense
